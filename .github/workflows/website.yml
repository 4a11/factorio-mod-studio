# Builds the website (the website/ folder) and publishes it to GitHub Pages: https://4a11.github.io/factorio-mod-studio/
# See website/PUBLISHING.md.
#
# It runs when the site changes on main, after a release is published (the Download and Changelog pages are built
# from the list of releases) and by hand: Actions -> Website -> Run workflow.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  # A release made by release.yml does not start other workflows by itself (it is created with GITHUB_TOKEN),
  # so this one follows the Release workflow instead of the release event.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

# Read the repository, write the Pages deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits for the one in progress instead of cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After a Release run: only when it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Refreshes the list of releases from the GitHub API, checks the types and builds the pages into website/dist.
      # The token only raises the API rate limit; it is not written into the pages.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASTRO_TELEMETRY_DISABLED: 1

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
