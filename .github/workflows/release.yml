# Publishes a release when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
# The tag has to match <Version> in Directory.Build.props.
# The GitHub release gets a ready-to-run build per system (no .NET needed). The NuGet package is pushed too
# when the NUGET_USER repository variable is set: NuGet Trusted Publishing, no API key is stored. It needs a
# Trusted Publishing policy on nuget.org for this repository and the workflow file release.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          # macOS builds have to be signed (ad hoc) to start on Apple Silicon; the SDK does that only on macOS.
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props"
            exit 1
          fi

      - name: Test
        if: matrix.rid == 'linux-x64'
        run: dotnet test -c Release

      - name: Publish the command-line tool and the desktop window
        run: |
          common="-c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/fmstudio"
          dotnet publish src/FactorioModStudio.Cli $common -p:PackAsTool=false
          dotnet publish src/FactorioModStudio.Desktop $common
          rm -f out/fmstudio/*.pdb   # native debug symbols of the graphics libraries (about 100 MB), not needed to run

      # Something to double-click on Linux and macOS too; both start FactorioModStudio from the unpacked folder, as on Windows.
      - name: Add the double-click launcher
        if: matrix.rid != 'win-x64'
        run: |
          launchers=src/FactorioModStudio.Desktop/launchers
          if [ "${{ matrix.os }}" = macos-latest ]; then
            app="out/fmstudio/Factorio Mod Studio.app/Contents"
            mkdir -p "$app/MacOS"
            version="${GITHUB_REF_NAME#v}"; version="${version%%-*}"   # bundle versions are numbers only: 0.3.0-rc1 -> 0.3.0
            sed "s/VERSION/$version/g" "$launchers/macos/Info.plist" > "$app/Info.plist"
            cp "$launchers/macos/launcher" "$app/MacOS/launcher"
            chmod +x "$app/MacOS/launcher"
          else
            cp "$launchers/linux/Factorio Mod Studio.desktop" out/fmstudio/
            chmod +x "out/fmstudio/Factorio Mod Studio.desktop"
          fi

      - name: Archive
        run: |
          cp README.md LICENSE out/fmstudio/
          name="fmstudio-$GITHUB_REF_NAME-${{ matrix.rid }}"
          mkdir dist
          cd out
          if [ "${{ matrix.rid }}" = win-x64 ]; then zip -r "../dist/$name.zip" fmstudio; else tar -czf "../dist/$name.tar.gz" fmstudio; fi

      - name: Pack the .NET tool
        if: matrix.rid == 'linux-x64'
        run: dotnet pack src/FactorioModStudio.Cli -c Release -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # NuGet Trusted Publishing exchanges the workflow's identity for a short-lived key
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          Download the archive for your system, unpack it anywhere, done: no .NET needed.

          - **Windows** (`win-x64.zip`): double-click `FactorioModStudio.exe` (or `fmstudio.exe`) and the studio opens in a window of its own, with a `mods` folder next to it as the workspace. Windows may warn about an unknown publisher: *More info → Run anyway*.
          - **Linux** (`linux-x64.tar.gz`): double-click `Factorio Mod Studio.desktop` in the unpacked folder where the file manager starts desktop entries (KDE, Xfce and others ask once to trust it); GNOME Files opens it as text instead, so there run `./FactorioModStudio` in a terminal in that folder. The window needs the WebKitGTK package (`webkit2gtk-4.1`); without it, it offers the browser instead, as does `./fmstudio ui`.
          - **macOS** (`osx-arm64` for Apple Silicon, `osx-x64` for Intel): clear the download quarantine first (`xattr -dr com.apple.quarantine .` in the unpacked folder), then double-click `Factorio Mod Studio.app`, or run `./FactorioModStudio`; `./fmstudio ui` opens the studio in the browser.
          - The desktop window is new and has been tried on Windows; reports from Linux and macOS are welcome.
          - **With the .NET 10 SDK**: `dotnet tool install -g FactorioModStudio.Cli` installs `fmstudio` from NuGet (the `.nupkg` here is the same package).

          Put the unpacked folder on your `PATH` to use `fmstudio validate`, `pack`, `smoke` and the rest from any mod folder.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes

      # After the GitHub release, so a NuGet problem never holds the archives back.
      - name: Log in to NuGet
        id: nuget
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        if: steps.nuget.outcome == 'success'
        run: dotnet nuget push "dist/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
