# Rewrites the notes of a release that is already out from CHANGELOG.md, e.g. after fixing its section:
# Actions -> Release notes -> Run workflow, with the tag (v0.2.0). New releases get their notes from release.yml.
name: Release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
      install:
        description: Add the install steps (off for releases before the desktop app, 0.1.x)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          INSTALL: ${{ inputs.install }}
        run: |
          if [ "$INSTALL" = true ]; then sh .github/scripts/release-notes.sh "$TAG" > notes.md
          else sh .github/scripts/release-notes.sh "$TAG" --no-install > notes.md; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
