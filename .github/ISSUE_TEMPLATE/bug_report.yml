name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A security problem should **not** go here: see [SECURITY.md](https://github.com/4a11/factorio-mod-studio/blob/main/SECURITY.md).
        One problem per report, please; a short report is fine, the more of the fields below are filled in, the faster it gets fixed.
  - type: dropdown
    id: area
    attributes:
      label: Where in the studio
      options:
        - Overview
        - Files (editor, code view)
        - Prototypes
        - Blocks
        - Resources
        - Localization
        - Problems
        - Build (run, smoke, Quick try, pack)
        - Installing Factorio
        - Command line
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran or the tab and buttons you used, step by step.
      placeholder: |
        1. Opened the base mod in the Files tab
        2. Clicked prototypes/entity/entities.lua
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Screenshots help a lot; paste or drop them here.
    validations:
      required: true
  - type: dropdown
    id: repro
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once so far
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: Which mod
      description: Your own mod (attach a zip if you can), `base`, or a link to the mod portal.
      placeholder: e.g. base, my-mod (zip attached), https://mods.factorio.com/mod/...
  - type: input
    id: version
    attributes:
      label: Factorio Mod Studio version
      description: Shown at the bottom of the sidebar, or the output of `fmstudio --version`.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Studio started as
      options:
        - Desktop app
        - Browser UI (fmstudio ui)
        - Command line
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: factorio
    attributes:
      label: Factorio version and how it is installed
      placeholder: e.g. 2.0.72 Steam, 2.1.24 zip from factorio.com, headless server installed by the studio, or "not relevant"
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Error messages, `--json` output or the relevant part of factorio-current.log.
      render: text
